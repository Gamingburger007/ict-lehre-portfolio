<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="760" height="300" rx="14" fill="#ffffff"/>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e8590c"/></marker></defs>
<text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#222" font-family="Consolas, monospace">int i = 5;   int *p_i = &amp;i;</text>
<text x="380" y="58" text-anchor="middle" font-size="14" fill="#666">Der Pointer speichert nicht die 5, sondern die Adresse (Wohnadresse) von i</text>
<!-- pointer box -->
<text x="160" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Pointer p_i</text>
<rect x="70" y="112" width="180" height="70" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5"/>
<text x="160" y="155" text-anchor="middle" font-size="22" font-weight="bold" fill="#222" font-family="Consolas, monospace">0x7ffc10</text>
<text x="160" y="205" text-anchor="middle" font-size="13" fill="#555" font-family="Consolas, monospace">eigene Adresse: 0x7ffc18</text>
<!-- arrow -->
<path d="M252,147 C 340,147 400,147 498,147" stroke="#e8590c" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="375" y="135" text-anchor="middle" font-size="14" fill="#e8590c" font-weight="bold">zeigt auf (wie ein Finger)</text>
<!-- variable box -->
<text x="600" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Variable i</text>
<rect x="510" y="112" width="180" height="70" rx="8" fill="#e7f0ff" stroke="#4c6ef5" stroke-width="2.5"/>
<text x="600" y="157" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">5</text>
<text x="600" y="205" text-anchor="middle" font-size="13" fill="#555" font-family="Consolas, monospace">Adresse: 0x7ffc10</text>
<!-- legend -->
<rect x="40" y="228" width="680" height="56" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
<text x="60" y="251" font-size="14" fill="#222" font-family="Consolas, monospace"><tspan font-weight="bold" fill="#e8590c">&amp;i</tspan><tspan font-family="Segoe UI, Arial, sans-serif" fill="#444">  → holt die Adresse von i  (0x7ffc10)</tspan></text>
<text x="400" y="251" font-size="14" fill="#222" font-family="Consolas, monospace"><tspan font-weight="bold" fill="#e8590c">*p_i</tspan><tspan font-family="Segoe UI, Arial, sans-serif" fill="#444">  → geht zur Adresse, liest den Wert (5)</tspan></text>
<text x="60" y="274" font-size="14" fill="#222" font-family="Consolas, monospace"><tspan font-weight="bold" fill="#e8590c">p_i</tspan><tspan font-family="Segoe UI, Arial, sans-serif" fill="#444">  → die gespeicherte Adresse selbst</tspan></text>
<text x="400" y="274" font-size="12.5" fill="#888">(Adressen sind nur Beispiele)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="760" height="330" rx="14" fill="#ffffff"/>
<defs><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e8590c"/></marker></defs>
<text x="380" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#222" font-family="Consolas, monospace">int *zahlen = malloc(5 * sizeof(int));</text>
<!-- stack -->
<rect x="40" y="60" width="230" height="200" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2"/>
<text x="155" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Stack</text>
<text x="155" y="106" text-anchor="middle" font-size="12.5" fill="#666">automatisch, verschwindet am</text>
<text x="155" y="122" text-anchor="middle" font-size="12.5" fill="#666">Ende der Funktion</text>
<rect x="65" y="145" width="180" height="56" rx="7" fill="#ffd8a8" stroke="#e8590c" stroke-width="2.5"/>
<text x="155" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#222" font-family="Consolas, monospace">zahlen</text>
<text x="155" y="190" text-anchor="middle" font-size="14" fill="#222" font-family="Consolas, monospace">= 0x5a10</text>
<!-- heap -->
<rect x="300" y="60" width="430" height="200" rx="10" fill="#ebfbee" stroke="#40c057" stroke-width="2"/>
<text x="515" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Heap</text>
<text x="515" y="106" text-anchor="middle" font-size="12.5" fill="#666">selber reservieren (malloc) und selber freigeben (free)</text>
<text x="515" y="122" text-anchor="middle" font-size="12.5" fill="#666">bleibt bestehen, auch wenn die Funktion fertig ist</text>
<g font-size="20" font-weight="bold" fill="#222" text-anchor="middle">
<rect x="368" y="148" width="64" height="50" rx="6" fill="#ffffff" stroke="#40c057" stroke-width="2"/><text x="400" y="180">42</text>
<rect x="436" y="148" width="64" height="50" rx="6" fill="#ffffff" stroke="#40c057" stroke-width="2"/><text x="468" y="180">7</text>
<rect x="504" y="148" width="64" height="50" rx="6" fill="#ffffff" stroke="#40c057" stroke-width="2"/><text x="536" y="180">93</text>
<rect x="572" y="148" width="64" height="50" rx="6" fill="#ffffff" stroke="#40c057" stroke-width="2"/><text x="604" y="180">15</text>
<rect x="640" y="148" width="64" height="50" rx="6" fill="#ffffff" stroke="#40c057" stroke-width="2"/><text x="672" y="180">61</text>
</g>
<g font-size="13" fill="#e8590c" text-anchor="middle" font-family="Consolas, monospace">
<text x="400" y="218">[0]</text><text x="468" y="218">[1]</text><text x="536" y="218">[2]</text><text x="604" y="218">[3]</text><text x="672" y="218">[4]</text>
</g>
<text x="536" y="244" text-anchor="middle" font-size="13" fill="#555">5 × 4 Bytes = 20 Bytes reserviert</text>
<!-- arrow -->
<path d="M247,173 C 300,173 320,173 360,173" stroke="#e8590c" stroke-width="3" fill="none" marker-end="url(#b)"/>
<!-- footer -->
<rect x="40" y="276" width="690" height="40" rx="8" fill="#fff4e6" stroke="#ffc078"/>
<text x="385" y="301" text-anchor="middle" font-size="14" fill="#222"><tspan font-weight="bold" font-family="Consolas, monospace">free(zahlen);</tspan>  gibt die 20 Bytes zurück. Ohne free bleibt der Platz belegt (Memory Leak).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

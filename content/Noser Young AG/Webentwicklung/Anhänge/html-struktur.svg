<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .box { fill: #ffffff; stroke-width: 2; rx: 8; }
    .label { font-size: 13px; fill: #1f2937; }
    .tag { font-size: 13px; font-weight: 600; fill: #0f172a; font-family: Consolas, monospace; }
    .comment { font-size: 11px; fill: #6b7280; font-style: italic; }
  </style>
  <rect width="640" height="460" fill="#f8fafc"/>

  <!-- DOCTYPE -->
  <text x="24" y="28" class="tag">&lt;!DOCTYPE html&gt;</text>
  <text x="210" y="28" class="comment">— deklariert das Format des Dokuments (1. Zeile)</text>

  <!-- html -->
  <rect x="16" y="44" width="608" height="396" class="box" stroke="#2563eb" fill="#eff6ff"/>
  <text x="28" y="66" class="tag">&lt;html lang="en"&gt;</text>
  <text x="200" y="66" class="comment">— lang gibt die Sprache des Inhalts an</text>

  <!-- head -->
  <rect x="32" y="80" width="576" height="190" class="box" stroke="#7c3aed" fill="#f5f3ff"/>
  <text x="44" y="102" class="tag">&lt;head&gt;</text>
  <text x="130" y="102" class="comment">— nicht sichtbar auf der Website, enthält Metadaten</text>

  <text x="56" y="128" class="label" font-family="Consolas, monospace">&lt;meta charset="UTF-8"&gt;</text>
  <text x="56" y="150" class="label" font-family="Consolas, monospace">&lt;meta name="Author" content="Tim Buergin"&gt;</text>
  <text x="56" y="172" class="label" font-family="Consolas, monospace">&lt;meta name="description" content="..."&gt;</text>
  <text x="56" y="194" class="label" font-family="Consolas, monospace">&lt;link rel="icon" href="gaming_pc.png"&gt;</text>
  <text x="400" y="194" class="comment">— Favicon (Tab-Symbol)</text>
  <text x="56" y="216" class="label" font-family="Consolas, monospace">&lt;title&gt;Meine Seite&lt;/title&gt;</text>
  <text x="44" y="252" class="tag">&lt;/head&gt;</text>

  <!-- body -->
  <rect x="32" y="284" width="576" height="130" class="box" stroke="#059669" fill="#ecfdf5"/>
  <text x="44" y="306" class="tag">&lt;body&gt;</text>
  <text x="130" y="306" class="comment">— alles hier ist auf der Website sichtbar</text>
  <text x="56" y="332" class="label" font-family="Consolas, monospace">&lt;h1&gt;...&lt;/h1&gt;  &lt;p&gt;...&lt;/p&gt;  &lt;img&gt;  &lt;a&gt; ...</text>
  <text x="44" y="392" class="tag">&lt;/body&gt;</text>

  <text x="28" y="430" class="tag">&lt;/html&gt;</text>
</svg>

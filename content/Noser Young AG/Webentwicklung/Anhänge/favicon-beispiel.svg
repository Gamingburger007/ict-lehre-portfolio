<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="220" fill="#f8fafc"/>

  <!-- browser chrome -->
  <rect x="20" y="20" width="300" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="20" width="300" height="34" rx="10" fill="#e2e8f0"/>
  <!-- tab -->
  <rect x="30" y="20" width="160" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <!-- favicon circle -->
  <circle cx="50" cy="37" r="9" fill="#2563eb"/>
  <text x="47" y="41" font-size="11" fill="#ffffff" font-weight="700">PC</text>
  <text x="66" y="41" font-size="12" fill="#1f2937">Meine Seite</text>
  <!-- window dots -->
  <circle cx="288" cy="28" r="4" fill="#f87171"/>
  <circle cx="302" cy="28" r="4" fill="#fbbf24"/>
  <circle cx="30" cy="100" r="0" fill="none"/>
  <text x="40" y="100" font-size="12" fill="#6b7280">Inhalt der Webseite ...</text>

  <!-- arrow -->
  <line x1="340" y1="37" x2="400" y2="37" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- code box -->
  <rect x="400" y="60" width="220" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="412" y="84" font-size="12" font-family="Consolas, monospace" fill="#1f2937">&lt;link rel="icon"</text>
  <text x="424" y="102" font-size="12" font-family="Consolas, monospace" fill="#1f2937">href="gaming_pc.png"</text>

  <text x="400" y="150" font-size="12" fill="#6b7280">rel = "relation": sagt dem Browser,</text>
  <text x="400" y="168" font-size="12" fill="#6b7280">in welcher Beziehung die Datei zur Seite steht.</text>
</svg>
